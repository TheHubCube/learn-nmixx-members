<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn the Faces of NMIXX</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#325479; --card:#ffffff; --ink:#2a1b3d; --grape:#5b3a9e; --tomato:#ff5a4e; --mint:#2fd08f; --sky:#4cc3ff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1b3d;--card:#3a2756;--ink:#fff4d6;--grape:#a98bff;--tomato:#ff7a6e;--mint:#3fe0a0;--sky:#6fd0ff}}
:root[data-theme="dark"]{--bg:#2a1b3d;--card:#3a2756;--ink:#fff4d6;--grape:#a98bff;--tomato:#ff7a6e;--mint:#3fe0a0;--sky:#6fd0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);
  background-image:url("images/strangemuse.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  color:var(--ink);font-family:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.4;display:flex;justify-content:center;padding:20px 14px 40px}
main{width:100%;max-width:520px}
h1{font-size:clamp(2.2rem,9vw,3.2rem);line-height:1;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;transform:rotate(-2deg);display:inline-block}
.sub{margin:0 0 16px;font-size:1rem;opacity:.85}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.chip{flex:1;min-width:90px;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:6px 12px;box-shadow:4px 4px 0 var(--ink);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.chip span:first-child{font-weight:400}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:16px;box-shadow:6px 6px 0 var(--ink)}
.pic{position:relative;aspect-ratio:1;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--sky),var(--mint));display:grid;place-items:center}
.photo{width:100%;height:100%;object-fit:cover}
.emoji{font-size:clamp(7rem,38vw,11rem);line-height:1;user-select:none}
.modes{display:flex;gap:10px;margin-bottom:14px}
.modes button{flex:1}
.modes button[aria-pressed="true"]{background:var(--grape);color:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{background:var(--card);color:var(--ink);text-align:center;padding:12px 8px}
.opt{color:#2a1b3d}
.opt:nth-child(1){background:#C6DCF3}
.opt:nth-child(2){background:#FFFFFF}
.opt:nth-child(3){background:#083090}
.opt:nth-child(4){background:#FFF677}
.opt:nth-child(5){background:#E8364C}
.opt:nth-child(6){background:#F4AFCC}
.opt:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through;box-shadow:none;transform:none}
.opt.right{background:var(--mint);color:var(--ink);opacity:1;text-decoration:none}
.opt.shake{animation:shake .35s}
.lives{text-align:center;font-size:1.3rem;min-height:1.8rem;margin-bottom:10px}
.row{display:flex;gap:10px}
button:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
button{font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--grape);border:3px solid var(--ink);border-radius:14px;padding:10px 16px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button.alt{background:var(--card);color:var(--ink)}
button.go{background:var(--tomato)}
.tools{display:flex;gap:10px;margin-top:14px}
.tools button{flex:1}
.msg{min-height:2.2rem;text-align:center;font-weight:600;margin:12px 0 0}
.msg.ok{color:var(--mint)}.msg.no{color:var(--tomato)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.15) rotate(-4deg)}}
.end{text-align:center;padding:10px 0}
.end .big{font-size:4rem}
.end .big img{display:block;max-width:100%;max-height:35vh;margin:0 auto 12px;object-fit:contain}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Learn who is whO.O</h1>
  <p class="sub">Choose the correct member in the frame, you lose a heart for every wrong answer.</p>
  <div class="modes" role="group" aria-label="Game mode">
    <button class="alt" id="m-classic" aria-pressed="true">Classic</button>
    <button class="alt" id="m-endless" aria-pressed="false">Endless</button>
  </div>
  <div class="bar">
    <div class="chip"><span>Round</span><b id="round">1</b></div>
    <div class="chip"><span>Score</span><b id="score">0</b></div>
    <div class="chip"><span>Streak</span><b id="streak">0</b></div>
  </div>
  <section class="card" id="game">
    <!-- place to tell that we are putting the image in the frame -->
    <div class="pic" id="pic"><img class="photo" id="photo" alt=""></div>
    <div class="lives" id="lives" aria-live="polite"></div>
    <div class="opts" id="opts" role="group" aria-label="Answer options"></div>
    <div class="tools"><button class="alt" id="skip">Skip</button></div>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>
</main>
<script>

// Declarables
// Custom images goes here
const ROUNDS=[
  {e:"images/0ac0c0df499d6d5772454c62787a99588ab3dfd5.jpg",a:"🐨 Lily"},
  {e:"images/ertyuinji7654edfghui76556yuik.jpg",a:"🐨 Lily"},
  {e:"images/04cec0c6399439b626a1a2220a05c7574ebedc86.jpg",a:"🐻 Haewon"},
  {e:"images/12e12haiiidj2dn2i1o.jpg",a:"🐻 Haewon"},
  {e:"images/0f001242e341866fa5f88ccefe7db8dfabb84bb6.jpg",a:"🐰 Sullyoon"},
  {e:"images/aasdddddddddddwmlwid92.jpg",a:"🐰 Sullyoon"},
  {e:"images/1a9a257205badaba03a291014df1b4c237b2f539.jpg",a:"🐤 Bae"},
  {e:"images/adf9d7a7s8d09tc98y0a8w0918hd1.jpg",a:"🐤 Bae"},
  {e:"images/fdb1a2a6a31afe9ac8f09eb47ad12e1bc6daa4cb.jpg",a:"🐶 Jiwoo"},
  {e:"images/121udnoioin1ondoasnco09821d.jpg",a:"🐶 Jiwoo"},
  {e:"images/1923e113bb59e3bdd8aafa435af41612b14ef982.jpg",a:"🐱 Kyujin"},
  {e:"images/asdqbwiudo120801808129d7918d.jpg",a:"🐱 Kyujin"}

];
const OPTIONS=["🐨 Lily","🐻 Haewon","🐰 Sullyoon","🐤 Bae","🐶 Jiwoo","🐱 Kyujin"];
const MAX_WRONG=4;
const CLASSIC_ROUNDS=6;
let mode="classic",order,idx,score,streak,wrong,lives,done,lost,solved,cur,bag=[],lastPic=null;
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();
  for(let i=a.length-1; i>0; i--)
    {const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a};

const gameHTML=$("game").innerHTML;

function nextEndless(){
  if(!bag.length){
    bag=shuffle(ROUNDS);
    if(bag[bag.length-1]===lastPic)
      [bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]];
  }
  lastPic=bag.pop();
  return lastPic;
}

function setMode(m){
  mode=m;
  $("m-classic").setAttribute("aria-pressed",String(m==="classic"));
  $("m-endless").setAttribute("aria-pressed",String(m==="endless"));
  start();
}

function start(){
  order=shuffle(ROUNDS).slice(0,CLASSIC_ROUNDS);idx=0;score=0;streak=0;lives=MAX_WRONG;lost=false;bag=[];lastPic=null;
  $("game").innerHTML=gameHTML;loadRound();
}

function loadRound(){
  cur=mode==="classic"?order[idx]:nextEndless();
  wrong=0;
  done=false;
  $("photo").src=cur.e;
  $("photo").alt=cur.a;
  $("opts").innerHTML=OPTIONS.map(o=>`<button class="opt" data-a="${o}">${o}</button>`).join("");
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b));
  $("round").textContent=mode==="classic"?(idx+1)+"/"+order.length:""+(idx+1);
  $("score").textContent=score;$("streak").textContent=streak;
  msg("");
  renderLives();
  const sk=$("skip");sk.textContent="Skip";sk.className="alt";sk.onclick=skip;
}

function renderLives(){
  $("lives").textContent="❤️".repeat(lives)+"🖤".repeat(MAX_WRONG-lives)
}

function msg(t,c){
  const m=$("msg");
  m.textContent=t;
  m.className="msg "+(c||"")
}

function finishRound(){
  done=true;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;
  if(b.dataset.a===cur.a)b.classList.add("right")});
  const last=lost||mode==="classic"&&idx+1>=order.length;
  const next=$("skip");next.textContent=last?"See results":"Next picture";
  next.className="go";next.onclick=advance;
  $("score").textContent=score;
  $("streak").textContent=streak;
}

function pick(btn){
  if(done)return;
  if(btn.dataset.a===cur.a){
    const pts=(MAX_WRONG-wrong)*3;
    streak++;
    solved++;
    const bonus=streak>=3?2:0;
    score+=pts+bonus;
    msg("Yes! +"+pts+(bonus?" (+2 streak bonus)":""),"ok");
    $("pic").classList.remove("pop");void $("pic").offsetWidth;$("pic").classList.add("pop");
    finishRound();
  }else{
    wrong++;
    lives--;
    streak=0;
    renderLives();
    btn.disabled=true;
    btn.classList.add("shake");
    if(lives<=0){
      lost=true;
      msg(mode==="endless"?"Out of hearts. End of run! It was "+cur.a+".":"Out of hearts. It was "+cur.a+".","no");
      finishRound();
    }else msg("NO.OPE","no");
    $("streak").textContent=streak;
  }
}

function skip(){
  if(done)return;streak=0;msg("Skipped. It was "+cur.a+".","no");finishRound()

}

function advance(){
  idx++;
  if(lost||(mode==="classic"&&idx>=order.length)||(mode==="endless"&&lost))
  return results();
  loadRound();
}

function results(){
  let face,body;
  if(mode==="classic"){
    const max=order.length*12;
    face=score>=max*.7?"images/daesang.jpg":score>=max*.4?"images/celebrate.gif":"images/disappointed.gif";
    body=`<p>${idx} of ${order.length} pictures played.`;
//   body=`<p>${idx} of ${order.length} pictures played. Best possible is ${max}.</p>`;
  }else{
    let best=0;
    try{best=parseInt(localStorage.getItem("nmixx-best-endless")||"0",10)||0;if(score>best){best=score;localStorage.setItem("nmixx-best-endless",String(best))}}catch(e){best=Math.max(best,score)}
    face=solved>=12?"images/daesang.jpg":solved>=5?"images/celebrate1.gif":"images/disappointed1.gif";
    body=`<p>You got ${solved} member picture${solved===1?"":"s"} before running out of hearts. Best your score: ${best}.</p>`;
  }
  $("game").innerHTML=`<div class="end"><div class="big"><img src="${face}" alt="Game result"></div><h2>You scored ${score}</h2>${body}<button class="go" id="again">Play again</button></div>`;
  $("again").onclick=start;
}
$("m-classic").onclick=()=>setMode("classic");
$("m-endless").onclick=()=>setMode("endless");
start();
</script>
</body>
</html>
